<!doctype html>
<!-- The only HTML page of a React app. React puts everything inside the div with id="root". -->
<html lang="en">
  <head>
    <meta charset="UTF-8" /> <!-- letters of every language -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- good on phones -->
    <title>Student Cards</title> <!-- the text on the browser tab -->
  </head>
  <body>
    <div id="root"></div> <!-- React draws the whole app here -->
    <!-- Load our first JavaScript file. type="module" lets us use import. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
